# ==============================================================================
# Alembic — Database Migration Configuration
# ==============================================================================
# Run migrations:  make db-upgrade
# New migration:   make db-migrate MSG="add api_keys table"
# Rollback:        make db-downgrade
# History:         make db-history
# ==============================================================================

[alembic]
script_location   = src/dns_analyzer/database/migrations
file_template     = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
prepend_sys_path  = .
version_path_separator = os

# Connection URL is read from DATABASE_URL environment variable at runtime.
# Do not hardcode credentials here.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
hooks = ruff
ruff.type = exec
ruff.entrypoint = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level    = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level    = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level    = INFO
handlers =
qualname = alembic

[handler_console]
class     = StreamHandler
args      = (sys.stderr,)
level     = NOTSET
formatter = generic

[formatter_generic]
format    = %(levelname)-5.5s [%(name)s] %(message)s
datefmt   = %H:%M:%S